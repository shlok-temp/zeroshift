zerops:
- setup: frontend
  build:
    base: ubuntu@24.04
    deployFiles:
    - frontend
  run:
    base: "ubuntu/nginx@latest"
    ports:
    - port: 80
      httpSupport: true
    documentRoot: frontend
    siteConfigPath: frontend/nginx.conf
    healthCheck:
      httpGet:
        port: 80
        path: /
      failureTimeout: 60s
- setup: api
  build:
    base: "ubuntu/python@3.12"
    buildCommands:
    - pip install -r requirements.txt
    deployFiles:
    - ./
    addToRunPrepare:
    - requirements.txt
  run:
    base: "ubuntu/python@3.12"
    prepareCommands:
    - pip install -r requirements.txt
    ports:
    - port: 8000
      httpSupport: true
    healthCheck:
      httpGet:
        port: 8000
        path: /health
      failureTimeout: 60s
    start: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
    envVariables:
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: db
      DB_USER: db
      DB_PASS: "${db_password}"
